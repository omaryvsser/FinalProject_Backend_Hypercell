databaseChangeLog:
  - changeSet:
      id: 6-create-payments-table
      author: backend-developer
      changes:
        - createTable:
            tableName: payments
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: amount
                  type: decimal(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: payment_method
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: transaction_id
                  type: varchar(255)
                  constraints:
                    unique: true
              - column:
                  name: booking_id
                  type: bigint
                  constraints:
                    nullable: false
                    unique: true 

        - addForeignKeyConstraint:
            baseTableName: payments
            baseColumnNames: booking_id
            referencedTableName: bookings
            referencedColumnNames: id
            constraintName: fk_payments_booking