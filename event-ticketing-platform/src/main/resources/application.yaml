spring:
  # [ADDED FOR TESTING] - H2 Database & Console Configuration
  # =========================================================
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true # يضمن إنشاء الجداول قبل تشغيل ملف data.sql
  # =========================================================