databaseChangeLog:
  - changeSet:
      id: 7-create-seat-categories-table
      author: backend-developer
      changes:
        - createTable:
            tableName: seat_categories
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: decimal(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: total_seats
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: available_seats
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: event_id
                  type: bigint
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: seat_categories
            baseColumnNames: event_id
            referencedTableName: events
            referencedColumnNames: id
            constraintName: fk_seat_categories_event
